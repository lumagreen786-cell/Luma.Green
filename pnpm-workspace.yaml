# The web app stays at the root; platform shells have isolated dependencies.
packages:
  - apps/*

# pnpm settings for this repo.
#
# `allowBuilds` is an explicit allowlist of packages permitted to run install
# scripts. pnpm blocks them by default — an install script is arbitrary code
# from a dependency, and the usual way a supply-chain attack lands. Only add a
# package here when something actually breaks without it, and say why.
allowBuilds:
  # Downloads Electron's platform runtime for local and CI desktop builds.
  electron: true
  # Squirrel.Windows is unused; Windows installers use NSIS.
  electron-winstaller: false
  # Downloads the esbuild binary. Vitest/Vite will not run without it.
  esbuild: true
  # Native bindings for the ESLint import resolver used by eslint-config-next.
  unrs-resolver: true
  # SWC binary used by @vitejs/plugin-react for the test transform.
  "@swc/core": true
  # Fetches the sentry-cli binary used for source-map upload at build time.
  "@sentry/cli": true
  # Falls back to a source build of a file watcher we don't rely on.
  "@parcel/watcher": false
  # Prints a funding message. That's all.
  core-js: false

# pnpm 11 will not install a package version younger than its default cooldown
# (a supply-chain guard: most malicious releases are caught within days). These
# entries were already in the tree when we migrated from npm, so they are
# exempted rather than downgraded. Remove an entry once a newer release ages in.
minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.82"
  - "@ai-sdk/provider-utils@5.0.41"
  - "@ai-sdk/provider@4.0.15"
  - "@posthog/core@1.54.2"
  - "@posthog/types@1.412.1"
  - "@tanstack/query-core@5.103.0"
  - "@tanstack/query-devtools@5.103.0"
  - "@tanstack/react-query-devtools@5.103.0"
  - "@tanstack/react-query@5.103.0"
  - "@types/node@24.13.5"
  - ai@7.0.102
  - posthog-js@1.433.5
  - prettier@3.9.7
  - resend@6.28.1
  # Exact Expo SDK 57 cohorts reviewed 7 and 14 October 2026.
  # Registry signatures and lockfile hashes verified; no global age change.
  # Evidence: docs/delivery/expo-sdk-57-release-review.md
  - "@expo/cli@57.0.28 || 57.0.30"
  - "@expo/config-plugins@57.0.10"
  - "@expo/config@57.0.10"
  - "@expo/image-utils@0.11.6"
  - "@expo/metro-config@57.0.13"
  - "@expo/metro-file-map@57.0.4"
  - "@expo/prebuild-config@57.0.17 || 57.0.19"
  - "@expo/require-utils@57.0.6"
  - "@expo/router-server@57.0.12"
  - "babel-preset-expo@57.0.14"
  - expo-asset@57.0.19 || 57.0.20
  - expo-constants@57.0.21 || 57.0.22
  - "expo-eas-client@57.0.5"
  - expo-modules-autolinking@57.0.14 || 57.0.16
  - expo-modules-core@57.0.21 || 57.0.23
  - expo-notifications@57.0.22 || 57.0.23
  - "expo-updates@57.0.25"
  - expo@57.0.27 || 57.0.29

# Security fixes for transitive packages. xcode only uses the CommonJS v4 API.
overrides:
  "xcode>uuid": 11.1.1
  "posthog-js>dompurify": 3.4.16

patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
