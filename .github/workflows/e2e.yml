name: E2E

# Playwright is the expensive check (browser download + build + run), so it is
# its own workflow: PRs only, and only when something it could actually break
# has changed.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "e2e-analytics/**"
      - "e2e-turnstile/**"
      - "messages/**"
      - "public/**"
      - "next.config.ts"
      - "playwright.config.ts"
      - "playwright.analytics.config.ts"
      - "playwright.turnstile.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    # The 33-locale browser suite takes about 16 minutes on one worker. Allow
    # both production builds and the separate analytics checks to finish too.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Browser binaries are ~150 MB; caching them saves ~1 min per run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm build
      - run: pnpm e2e
      - name: OTP bot-check browser boundary (isolated providers)
        run: pnpm exec playwright test --config playwright.turnstile.config.ts
      - name: Build configured analytics with test keys
        run: pnpm exec next build --webpack
        env:
          NEXT_PUBLIC_TELEMETRY_ENABLED: "true"
          NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-LUMATEST"
          NEXT_PUBLIC_POSTHOG_KEY: "phc_luma_test"
          NEXT_PUBLIC_SENTRY_DSN: "https://public@example.invalid/1"
          SENTRY_AUTH_TOKEN: ""
      - name: Analytics consent with intercepted providers
        run: pnpm exec playwright test --config playwright.analytics.config.ts

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
