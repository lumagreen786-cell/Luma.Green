# CodeRabbit configuration — https://docs.coderabbit.ai
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# The house rules live in AGENTS.md; this tells the reviewer to enforce them.
# Review suggestions do not authorize a merge, deployment or provider call.
language: en

early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"

  path_filters:
    - "!**/package-lock.json"
    - "!**/coverage/**"
    - "!**/.next/**"
    - "!convex/_generated/**"
    - "!**/*.svg"

  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: >
        Enforce current AGENTS.md and the accepted UI contract. Respect the
        English-only admin navigation/copy exception. Flag other user-facing
        strings outside messages/*.json, locale-dropping navigation, raw colours,
        physical RTL layout properties, unsafe type widening, and unnecessary
        client boundaries. Check saved input on back/reload, unavailable states,
        keyboard names/focus, all locale scripts and phone layouts. Fixtures
        prove UI behavior only, not real authentication or provider acceptance.
    - path: "convex/**/*.ts"
      instructions: >
        Check authenticated caller and record/workspace permission before
        private reads and writes; never trust a caller-provided owner or quota
        identity. Review public and internal boundaries, not just UI guards.
        Money is integer paise, mass integer grams; reject unsafe integers and
        use safePaiseFor for untrusted totals. Preserve auditable transitions,
        stock reservation/receipt/refund idempotency and frozen carbon factors.
        Prefer indexed bounded queries; flag unbounded scans or filter-before-
        authorization. Paid provider calls belong in Convex actions with shared
        account/day limits, duplicate guards, bounded timeouts and no automatic
        paid retry. Require explicit business confirmation and real provider
        evidence. Never add activation fallback, manual paid override or raw
        identity/provider payloads in logs, audit rows or error messages.
    - path: "convex/auth*.ts"
      instructions: >
        Preserve all authentication factors through Better Auth's real HTTP
        handler and Convex adapter. Phone accounts stay passwordless; configured
        admin phone requires TOTP. No restored session before the full challenge,
        public fixture login, simulated OTP or missing-service bypass. Binding a
        phone to an existing email identity must preserve session and TOTP.
        Require boundary tests and no credentials or raw phone/email in output.
    - path: "convex/lib/access*.ts"
      instructions: >
        Check household/applicant and operator access separately. Never infer
        membership from a selected UI workspace or caller-supplied identifiers.
        Check removed memberships, unrelated organizations and private documents.
    - path: "src/lib/{analytics*,monitoring*}"
      instructions: >
        Analytics needs the operator switch, visitor consent and public-route
        allowlist at send time. Permit only the approved manual pageview fields.
        No private funnels, replay, autocapture, identify, contact, precise
        location or booking tokens. Sentry is separate error-only reporting:
        keep its allowlist scrubber, no raw message/request/body/breadcrumbs,
        and zero tracing/profiling/replay. Account setup is not live receipt.
    - path: "{.gitleaks.toml,patches/**,pnpm-workspace.yaml}"
      instructions: >
        Treat scanner exceptions and dependency patches as security-sensitive.
        Require exact synthetic values plus narrow paths, or documented
        advisory-specific evidence and a regression test. Do not exclude whole
        test/doc directories, disable generic-key detection or bypass install
        integrity checks. Never quote a detected live secret in review output.
    - path: "messages/*.json"
      instructions: >
        Keys must match messages/en.json exactly. Flag empty strings, English
        left in a non-English file, and any concatenation-shaped string that
        should use ICU plural or select syntax.
    - path: ".github/workflows/**"
      instructions: >
        Preserve the five required CI jobs without path filters or ignored
        failures. Require timeouts, concurrency cancellation, least token
        permissions and immutable action/tool pins for new security jobs.
        Reject pull_request_target with untrusted code, application secrets in
        checks, bot write/merge grants and unconditional private paid scanners.
        Review every scanner allowlist change; do not suppress directories or
        advisories to obtain a green result. A patched dependency needs a
        reviewed patch and regression evidence, not only a version exemption.
        Production is the only permitted deployment target; no Preview jobs.
    - path: "e2e/**/*.ts"
      instructions: >
        Flag waitForTimeout and CSS/class-based selectors; require role-based
        queries and web-first assertions.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  tools:
    eslint:
      enabled: true
    markdownlint:
      enabled: false

chat:
  auto_reply: true

# Keep private repository context inside this repository's review scope.
knowledge_base:
  automatic_linking_mode: disabled
  linked_repositories: []
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled
  web_search:
    enabled: false
